services:
  postgres:
    image: postgres:16-alpine
    container_name: callbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callbot}
      POSTGRES_USER: ${POSTGRES_USER:-callbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callbot} -d ${POSTGRES_DB:-callbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    # Explicit tag: both stacks would otherwise derive "<project>-app" and clash.
    image: callbot-app:latest
    container_name: callbot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-callbot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-callbot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-callbot}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32bytes-minimum-required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
      DISCORD_WEBHOOK_CLIENT: ${DISCORD_WEBHOOK_CLIENT:-}
      DISCORD_WEBHOOK_RESTAURANT: ${DISCORD_WEBHOOK_RESTAURANT:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
