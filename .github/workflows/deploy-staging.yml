name: Deploy staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rendre et déposer le .env
        run: |
          cat > .env <<EOF
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SERVICE_API_KEY=${{ secrets.SERVICE_API_KEY }}
          FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}
          DISCORD_WEBHOOK_CLIENT=${{ secrets.DISCORD_WEBHOOK_CLIENT }}
          DISCORD_WEBHOOK_RESTAURANT=${{ secrets.DISCORD_WEBHOOK_RESTAURANT }}
          VOYAGE_API_KEY=${{ secrets.VOYAGE_API_KEY }}
          EOF
          scp -i ~/.ssh/id_ed25519 .env "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/hikky/.env"

      - name: Envoyer le code au serveur
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude '.git' --exclude 'target' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/hikky/backend-src/"

      - name: Construire et déployer sur le serveur
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/opt/hikky/deploy.sh backend ${{ github.sha }}"
