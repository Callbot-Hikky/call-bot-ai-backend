spring:
  application:
    name: call-bot-ai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/callbot}
    username: ${SPRING_DATASOURCE_USERNAME:callbot}
    password: ${SPRING_DATASOURCE_PASSWORD:callbot}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it against the entities.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Override JWT_SECRET in production. Must be at least 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-required}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  service:
    # API key for the AI microservice (X-Api-Key header). Empty = service auth disabled.
    api-key: ${SERVICE_API_KEY:}
  discord:
    webhook-client: ${DISCORD_WEBHOOK_CLIENT:}
    webhook-restaurant: ${DISCORD_WEBHOOK_RESTAURANT:}
  frontend:
    base-url: ${FRONTEND_BASE_URL:}
  payment:
    # Which payment adapter to activate. Adding a provider = one adapter package + this value.
    provider: ${PAYMENT_PROVIDER:stripe}
  stripe:
    # Secret key (sk_test_... / sk_live_...). Empty = checkout disabled (502 on call).
    secret-key: ${STRIPE_SECRET_KEY:}
    # Frontend pages the customer is redirected to after / instead of paying.
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/offre/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/offre}
    # Recurring Price per offer code. No entry = inline price fallback.
    price-ids:
      pro: ${STRIPE_PRO_PRICE_ID:}
    # Signing secret (whsec_...) to verify incoming webhooks.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  stripe-connect:
    # Diner payments run through Stripe Connect, on its own endpoint and its own
    # signing secret: Stripe signs each endpoint separately.
    webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
    # Back-office pages Stripe returns the restaurateur to after onboarding.
    return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:4200/parametres/paiements?onboarding=done}
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:4200/parametres/paiements?onboarding=refresh}
    # Pages the diner lands on after (or instead of) paying their booking fee.
    success-url: ${STRIPE_CONNECT_SUCCESS_URL:http://localhost:4200/client/reservations/payee}
    top-up-success-url: ${STRIPE_CONNECT_TOP_UP_SUCCESS_URL:http://localhost:4200/client/reservations/complement-regle}
    cancel-url: ${STRIPE_CONNECT_CANCEL_URL:http://localhost:4200/client/reservations/paiement-annule}
    country: ${STRIPE_CONNECT_COUNTRY:FR}
  payout:
    # Nightly sweep sending collected booking fees to the restaurateurs' banks.
    cron: ${PAYOUT_CRON:0 15 4 * * *}
  no-show:
    # How often penalties past their cancellation window are attempted.
    charge-scan-interval-ms: ${NO_SHOW_CHARGE_SCAN_INTERVAL_MS:600000}
    # Nightly pass forgetting the cards of services that can no longer produce a debit.
    detach-cron: ${NO_SHOW_DETACH_CRON:0 45 4 * * *}
  cors:
    # Frontend origins allowed to call the API from a browser (comma-separated).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    com.callbot.ai: ${LOG_LEVEL:INFO}
